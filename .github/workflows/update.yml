name: Update prices

on:
  schedule:
    # Every 6 hours, offset off the hour: GitHub drops scheduled runs when
    # too many fire at once, and :17 avoids the top-of-hour stampede.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Collect
        run: python scripts/collect.py
      - name: Normalize
        run: python scripts/normalize.py
      - name: Charts
        run: python scripts/charts.py
      - name: README
        run: python scripts/render_readme.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no changes"
          else
            MOVES=$(python -c "import json;print(json.load(open('data/current/meta.json'))['changes_this_run'])")
            if [ "$MOVES" -gt 0 ]; then
              git commit -m "prices: $MOVES change(s) - $(date -u +'%Y-%m-%d %H:%MZ')"
            else
              git commit -m "check: no price changes - $(date -u +'%Y-%m-%d %H:%MZ')"
            fi
            git push
          fi
